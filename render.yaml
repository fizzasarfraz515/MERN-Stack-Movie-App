# Render Blueprint: creates both services from this one file.
# Dashboard -> New -> Blueprint -> pick this repository.
services:
  # ---- Backend: Node web service ----------------------------------------
  - type: web
    name: cineverse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render creates a strong random secret for you
      - key: MONGO_URI
        sync: false # you paste this in the dashboard
      - key: TMDB_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false # the frontend URL, e.g. https://cineverse-web.onrender.com

  # ---- Frontend: static site ----------------------------------------------
  - type: web
    name: cineverse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-page app: every path must serve index.html so React Router can handle it.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://cineverse-api.onrender.com/api
      - key: VITE_TMDB_IMAGE_BASE_URL
        value: https://image.tmdb.org/t/p
